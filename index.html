<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>MI Trading Co - Bearings Catalog</title>
    <style>
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
        }
        body {
            background-color: #f4f6f9;
            color: #333;
            padding: 20px;
        }
        header {
            text-align: center;
            margin-bottom: 30px;
            padding: 20px;
            background: #002b49;
            color: white;
            border-radius: 8px;
        }
        header h1 {
            font-size: 28px;
            letter-spacing: 1px;
        }
        header p {
            font-size: 14px;
            color: #ffcc00;
            margin-top: 5px;
        }
        .status {
            text-align: center;
            font-size: 18px;
            font-weight: bold;
            margin: 20px 0;
            color: #555;
        }
        .product-grid {
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(260px, 1fr));
            gap: 20px;
            max-width: 1200px;
            margin: 0 auto;
        }
        .card {
            background: #fff;
            border-radius: 8px;
            box-shadow: 0 4px 10px rgba(0,0,0,0.08);
            overflow: hidden;
            display: flex;
            flex-direction: column;
            transition: transform 0.2s;
        }
        .card:hover {
            transform: translateY(-4px);
        }
        .card img {
            width: 100%;
            height: 200px;
            object-fit: contain;
            background-color: #fff;
            padding: 10px;
            border-bottom: 1px solid #eee;
        }
        .card-body {
            padding: 15px;
            display: flex;
            flex-direction: column;
            flex-grow: 1;
        }
        .card-title {
            font-size: 16px;
            font-weight: 700;
            color: #002b49;
            margin-bottom: 8px;
            height: 42px;
            overflow: hidden;
        }
        .card-price {
            font-size: 18px;
            color: #d9534f;
            font-weight: bold;
            margin-bottom: 10px;
        }
        .card-desc {
            font-size: 12px;
            color: #666;
            line-height: 1.4;
            max-height: 80px;
            overflow-y: auto;
            margin-bottom: 12px;
            border-top: 1px dashed #ddd;
            padding-top: 8px;
        }
        .card-code {
            font-size: 11px;
            background: #eef2f5;
            padding: 4px 8px;
            border-radius: 4px;
            color: #444;
            word-break: break-all;
            margin-top: auto;
        }
    </style>
</head>
<body>

    <header>
        <h1>MI TRADING CO</h1>
        <p>Industrial Bearings Catalog</p>
    </header>

    <div id="status" class="status">Loading Bearings...</div>

    <div id="product-container" class="product-grid"></div>

    <script>
        const API_URL = 'https://abdultraders.pk/products.json?limit=250';
        const FALLBACK_IMAGE = 'https://via.placeholder.com/250x200?text=Bearing+Image';

        async function fetchBearings() {
            const statusDiv = document.getElementById('status');
            const container = document.getElementById('product-container');

            try {
                const response = await fetch(API_URL);
                if (!response.ok) throw new Error('Failed to fetch data');
                
                const data = await response.json();
                const products = data.products || [];

                // Filter bearing related products
                const bearings = products.filter(item => {
                    const title = item.title.toLowerCase();
                    return title.includes('bearing') || title.includes('sleeve') || title.includes('lmk') || title.includes('block');
                });

                if (bearings.length === 0) {
                    statusDiv.innerHTML = 'No bearings found.';
                    return;
                }

                statusDiv.style.display = 'none';
                container.innerHTML = '';

                bearings.forEach(item => {
                    // Extract Details
                    const title = item.title || 'Bearing Item';
                    const imageSrc = (item.images && item.images.length > 0) ? item.images[0].src : FALLBACK_IMAGE;
                    const price = (item.variants && item.variants[0]) ? `Rs. ${item.variants[0].price}` : 'N/A';
                    const sku = (item.variants && item.variants[0] && item.variants[0].sku) ? item.variants[0].sku : `ID: ${item.id}`;
                    
                    // Clean HTML tags from description
                    const tmp = document.createElement('DIV');
                    tmp.innerHTML = item.body_html || 'No description available.';
                    const cleanDesc = tmp.textContent || tmp.innerText || '';

                    // Create Card HTML
                    const card = document.createElement('div');
                    card.className = 'card';
                    card.innerHTML = `
                        <img src="${imageSrc}" alt="${title}" onerror="this.onerror=null;this.src='${FALLBACK_IMAGE}';">
                        <div class="card-body">
                            <div class="card-title">${title}</div>
                            <div class="card-price">${price}</div>
                            <div class="card-desc">${cleanDesc}</div>
                            <div class="card-code"><strong>Code/SKU:</strong> ${sku}</div>
                        </div>
                    `;
                    container.appendChild(card);
                });

            } catch (error) {
                console.error('Error fetching data:', error);
                statusDiv.innerHTML = 'Failed to load images and bearings. Please refresh.';
            }
        }

        // Run fetch on page load
        fetchBearings();
    </script>
</body>
</html>
